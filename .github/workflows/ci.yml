name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run test suite with pytest
      run: |
        pytest -c pytest.ini tests/

    - name: Build Docker image
      run: |
        docker build -t california-housing-api:latest .

    - name: Test Docker container run & endpoints
      run: |
        docker run -d -p 8000:8000 --name api-service california-housing-api:latest
        sleep 5
        curl --fail http://localhost:8000/health
        curl --fail -X POST http://localhost:8000/predict \
          -H "Content-Type: application/json" \
          -d '{"longitude": -122.23, "latitude": 37.88, "housing_median_age": 41.0, "total_rooms": 880.0, "total_bedrooms": 129.0, "population": 322.0, "households": 126.0, "median_income": 8.3252, "ocean_proximity": "NEAR BAY"}'
        docker stop api-service
